<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#111111"/>

  <!-- Outer reticle ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.35"/>
  <!-- Inner reticle ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
  <!-- Center ring -->
  <circle cx="32" cy="32" r="9" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.9"/>

  <!-- Crosshair lines -->
  <line x1="32" y1="4"  x2="32" y2="23" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="41" x2="32" y2="60" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4"  y1="32" x2="23" y2="32" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="32" x2="60" y2="32" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Corner ticks -->
  <line x1="8"  y1="8"  x2="14" y2="8"  stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="8"  y1="8"  x2="8"  y2="14" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="56" y1="8"  x2="50" y2="8"  stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="56" y1="8"  x2="56" y2="14" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="8"  y1="56" x2="14" y2="56" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="8"  y1="56" x2="8"  y2="50" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="56" y1="56" x2="50" y2="56" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="56" y1="56" x2="56" y2="50" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Skull: cranium -->
  <ellipse cx="32" cy="30" rx="7" ry="6.5" fill="#FF6B00"/>
  <!-- Skull: jaw -->
  <rect x="25.5" y="34.5" width="13" height="5.5" rx="2" fill="#FF6B00"/>
  <!-- Eye sockets -->
  <circle cx="29" cy="30" r="2" fill="#111111"/>
  <circle cx="35" cy="30" r="2" fill="#111111"/>
  <!-- Teeth gaps -->
  <rect x="27" y="37" width="3.5" height="2.5" rx="0.8" fill="#111111"/>
  <rect x="32.5" y="37" width="3.5" height="2.5" rx="0.8" fill="#111111"/>
</svg>
